[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/game-status.json"]
  external_node_modules = ["steam-user"]

[functions."steam-build-check"]
  schedule = "@hourly"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/game-status"
  to = "/.netlify/functions/game-status"
  status = 200

[[redirects]]
  from = "/api/contact-message"
  to = "/.netlify/functions/contact-message"
  status = 200

